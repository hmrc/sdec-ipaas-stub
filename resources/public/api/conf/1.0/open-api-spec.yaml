openapi: 3.0.3
info:
  version: 1.0
  title: SDEC iPaaS Stub
  description: "Stub of the SDEC iPaaS API for threads, staff and file metadata."
tags: []
paths:
  /sdec-ipaas-stub/api/v1/staff:
    post:
      operationId: createStaff
      tags:
      - Staff
      summary: Create or insert a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.Staff"
      responses:
        "200":
          description: Staff member saved
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.ErrorMessage"
    put:
      operationId: upsertStaff
      tags:
      - Staff
      summary: Update or insert a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.StaffUpdate"
      responses:
        "200":
          description: Staff member saved
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.ErrorMessage"
  /sdec-ipaas-stub/api/v1/thread/pid/{pid}/team/{team}:
    get:
      operationId: listWorkspaceThreads
      tags:
      - Thread
      summary: List threads for a workspace
      parameters:
      - in: path
        name: pid
        required: true
        schema:
          type: string
      - in: path
        name: team
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Threads in the workspace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.ThreadSummary"
  /sdec-ipaas-stub/api/v1/thread:
    post:
      operationId: createThread
      tags:
      - Thread
      summary: Create a thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.CreateThreadRequest"
      responses:
        "200":
          description: Thread created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.ThreadResponse"
        "400":
          description: "Invalid body, unknown staff member or unknown team"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.ErrorMessage"
  /sdec-ipaas-stub/api/v1/thread/{threadRef}/file:
    post:
      operationId: saveThreadFile
      tags:
      - File
      summary: Attach file metadata to a thread
      parameters:
      - in: path
        name: threadRef
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.FileMetadata"
      responses:
        "200":
          description: File saved
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.ErrorMessage"
  /sdec-ipaas-stub/api/v1/thread/{threadRef}:
    put:
      operationId: updateThread
      tags:
      - Thread
      summary: Update a thread
      parameters:
      - in: path
        name: threadRef
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.ThreadUpdate"
      responses:
        "200":
          description: Thread updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.ThreadResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.ErrorMessage"
  /sdec-ipaas-stub/api/v1/customer/thread/{threadId}:
    put:
      operationId: getThreadReference
      tags:
      - Customer
      summary: Look up a thread reference by thread ID
      parameters:
      - in: path
        name: threadId
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Thread reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.ThreadReference"
        "400":
          description: Lookup failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.ErrorMessage"
components:
  schemas:
    uk.gov.hmrc.sdecipaasstub.dto.ThreadDetails:
      properties:
        message:
          type: string
        responseDate:
          type: string
          format: date
      required:
      - message
      - responseDate
    uk.gov.hmrc.sdecipaasstub.dto.RecipientDetails:
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        nationalInsuranceNumber:
          type: string
        hasRelatedCase:
          type: boolean
        caseReferenceNumber:
          type: string
          nullable: true
      required:
      - firstName
      - lastName
      - email
      - phoneNumber
      - nationalInsuranceNumber
      - hasRelatedCase
    uk.gov.hmrc.sdecipaasstub.dto.Team:
      properties:
        id:
          type: integer
          format: int64
        srsName:
          type: string
        isTaskBased:
          type: boolean
      required:
      - id
      - srsName
      - isTaskBased
    uk.gov.hmrc.sdecipaasstub.dto.StaffDetails:
      properties:
        id:
          type: integer
          format: int64
        pid:
          type: string
        name:
          type: string
      required:
      - id
      - pid
      - name
    uk.gov.hmrc.sdecipaasstub.dto.ThreadReference:
      properties:
        id:
          type: string
        status:
          type: uk.gov.hmrc.sdecipaasstub.hcp.entity.threadstatus
        createdBy:
          $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.StaffDetails"
        createdTimeStamp:
          type: string
          format: date-time
        lastUpdatedTimeStamp:
          type: string
          format: date-time
        threadExpiryDate:
          type: string
          format: date
        associatedCaseReference:
          type: string
        threadOwner:
          nullable: true
          $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.StaffDetails"
        owningTeam:
          $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.Team"
        recipientDetails:
          $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.RecipientDetails"
        threadDetails:
          $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.ThreadDetails"
      required:
      - id
      - status
      - createdBy
      - createdTimeStamp
      - lastUpdatedTimeStamp
      - threadExpiryDate
      - associatedCaseReference
      - owningTeam
      - recipientDetails
      - threadDetails
    uk.gov.hmrc.sdecipaasstub.dto.RequestedBy:
      properties:
        day:
          type: integer
          format: int32
        month:
          type: integer
          format: int32
        year:
          type: integer
          format: int32
      required:
      - day
      - month
      - year
    uk.gov.hmrc.sdecipaasstub.dto.ThreadUpdate:
      properties:
        firstName:
          type: string
          nullable: true
        surname:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        mobile:
          type: string
          nullable: true
        nino:
          type: string
          nullable: true
        caseReference:
          type: string
          nullable: true
        requestedItems:
          type: array
          items:
            type: string
        message:
          type: string
        requestedBy:
          $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.RequestedBy"
      required:
      - requestedItems
      - message
      - requestedBy
    uk.gov.hmrc.sdecipaasstub.dto.FileMetadata:
      properties:
        filename:
          type: string
        s3Bucket:
          type: string
        filesize:
          type: integer
          format: int64
        filetype:
          type: string
        objectKey:
          type: string
        etag:
          type: string
      required:
      - filename
      - s3Bucket
      - filesize
      - filetype
      - objectKey
      - etag
    uk.gov.hmrc.sdecipaasstub.dto.ThreadResponse:
      properties:
        threadReference:
          type: string
      required:
      - threadReference
    uk.gov.hmrc.sdecipaasstub.dto.CreateThreadRequest:
      properties:
        pid:
          type: string
        team:
          type: string
      required:
      - pid
      - team
    uk.gov.hmrc.sdecipaasstub.dto.ContactStatus:
      properties:
        status:
          type: string
      required:
      - status
    uk.gov.hmrc.sdecipaasstub.dto.ThreadStatus:
      properties: {}
    uk.gov.hmrc.sdecipaasstub.dto.ThreadSummary:
      properties:
        reference:
          type: string
        caseReference:
          type: string
          nullable: true
        contactName:
          type: string
        status:
          $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.ThreadStatus"
        lastReplyDate:
          nullable: true
          type: string
          format: date
        deadline:
          nullable: true
          type: string
          format: date
        contactStatus:
          $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.ContactStatus"
      required:
      - reference
      - contactName
      - status
      - contactStatus
    uk.gov.hmrc.sdecipaasstub.dto.TeamRole:
      properties:
        team:
          type: string
        role:
          type: uk.gov.hmrc.sdecipaasstub.hcp.entity.role
      required:
      - team
      - role
    uk.gov.hmrc.sdecipaasstub.dto.StaffUpdate:
      properties:
        pid:
          type: string
        name:
          type: string
        email:
          type: string
        enrollments:
          type: array
          items:
            $ref: "#/components/schemas/uk.gov.hmrc.sdecipaasstub.dto.TeamRole"
      required:
      - pid
      - name
      - email
      - enrollments
    uk.gov.hmrc.sdecipaasstub.dto.ErrorMessage:
      properties:
        error:
          type: array
          items:
            type: string
      required:
      - error
    uk.gov.hmrc.sdecipaasstub.dto.Staff:
      properties:
        pid:
          type: string
        name:
          type: string
        email:
          type: string
        srs:
          type: string
      required:
      - pid
      - name
      - email
      - srs
servers:
- url: https://test-api.service.hmrc.gov.uk
  description: Sandbox
