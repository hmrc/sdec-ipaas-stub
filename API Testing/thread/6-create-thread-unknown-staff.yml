info:
  name: Create thread with unknown staff
  type: http
  seq: 6

http:
  method: POST
  url: "{{HOST}}/sdec-ipaas-stub/api/v1/thread"
  body:
    type: json
    data: |-
      {
        "pid": "9999",
        "team": "{{TEAM}}"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body
      operator: isJson
    - expression: res.body.error[0]
      operator: eq
      value: No staff found for pid 9999

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
