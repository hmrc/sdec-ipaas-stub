info:
  name: Create thread
  type: http
  seq: 1

http:
  method: POST
  url: "{{HOST}}/sdec-ipaas-stub/api/v1/thread"
  body:
    type: json
    data: |-
      {
        "pid": "1001",
        "team": "Child_Benefit"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          const threadReference = `${res.body.threadReference}`;
          bru.setVar('THREAD_REFERENCE', threadReference);
        } else {
          throw new Error('Could not set the THREAD_REFERENCE environment variable.');
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isJson
    - expression: res.body.threadReference
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
