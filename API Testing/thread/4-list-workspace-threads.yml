info:
  name: List workspace threads
  type: http
  seq: 4

http:
  method: GET
  url: "{{HOST}}/sdec-ipaas-stub/api/v1/thread/pid/:pid/team/:team"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: pid
      value: "{{STAFF_PID}}"
      type: path
    - name: team
      value: "{{TEAM}}"
      type: path

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isJson
    - expression: res.body
      operator: isArray
    - expression: res.body[0].reference
      operator: isDefined
    - expression: res.body[0].status
      operator: isDefined
    - expression: res.body[0].contactStatus
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
