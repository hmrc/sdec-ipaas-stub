info:
  name: File Upload
  type: http

http:
  method: POST
  url: "http://localhost:4999/sdec-ipaas-stub/api/v1/thread/{{thread-reference}}"
  body:
    type: json
    data: |-
      {
        "filename": "file.txt",
        "fileSize": 1234456,
        "filetype": "text/txt",
        "objectKey": "/uploads/{{thread-reference}}/file.txt",
        "etag": "4f8894d7eae7cc9c686872c5da5b3e98"
      }
  auth: inherit
