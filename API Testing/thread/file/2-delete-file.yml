info:
  name: Delete file
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{HOST}}/sdec-ipaas-stub/api/v1/thread/:thread-reference/file/:file-id"
  params:
    - name: thread-reference
      value: "{{THREAD_REFERENCE}}"
      type: path
    - name: file-id
      value: "{{FILE_ID}}"
      type: path

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("THREAD_REFERENCE")) {
          throw new Error("No thread reference. Run 'Create thread' first.");
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
