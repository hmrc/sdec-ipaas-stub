info:
  name: View Thread Details
  type: http
  seq: 2

http:
  method: GET
  url: "{{HOST}}/sdec-ipaas-stub/api/v1/external/thread/:thread-reference"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: thread-reference
      value: "{{THREAD_REFERENCE}}"
      type: path

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: application/json
    - expression: res.body.threadReference
      operator: eq
      value: "{{THREAD_REFERENCE}}"
    - expression: res.body.status
      operator: isDefined
    - expression: res.body.requestedItems
      operator: isDefined
    - expression: res.body.message
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
