info:
  name: Test File Upload Invalid
  type: http
  seq: 4

http:
  method: POST
  url: https://api.hmrc.qa.le.gb.cam.boomi.com/ws/rest/files/v1/upload?thread=ABCDEFGH2345
  headers:
    - name: Content-Type
      value: application/pdf
    - name: X-File-Name
      value: test.docx
    - name: X-Correlation-Id
      value: batch-001
    - name: X-Source-System
      value: SDEC
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  params:
    - name: thread
      value: ABCDEFGH2345
      type: query
  body:
    type: file
    data:
      - filePath: files/test.docx
        contentType: application/pdf
        selected: true

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body
      operator: isJson
    - expression: res.body.fileId
      operator: eq
      value: batch-001
    - expression: res.body.message
      operator: eq
      value: "File extension not allowed. Allowed: .csv, .xml, .pdf, .zip, .txt"
    - expression: res.body.errorCode
      operator: eq
      value: INVALID_EXTENSION
    - expression: res.body.status
      operator: eq
      value: REJECTED

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
