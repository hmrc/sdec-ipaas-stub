info:
  name: File Upload 2
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:4999/sdec-ipaas-stub/api/v1/thread/{{THREAD_REFERENCE}}/file
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "filename": "file.txt",
        "s3Bucket": "bucket123",
        "filesize": 1234456,
        "filetype": "text/txt",
        "objectKey": "/uploads/{{THREAD_REFERENCE}}/file.txt",
        "etag": "4f8894d7eae7cc9c686872c5da5b3e98"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.filename
      operator: eq
      value: file.txt

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
