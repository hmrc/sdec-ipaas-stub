info:
  name: File Upload
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:4999/sdec-ipaas-stub/api/v1/thread/{{THREAD_REFERENCE}}
  body:
    type: json
    data: |-
      {
        "filename": "file.txt",
        "fileSize": 1234456,
        "filetype": "text/txt",
        "objectKey": "/uploads/{{THREAD_REFERENCE}}/file.txt",
        "etag": "4f8894d7eae7cc9c686872c5da5b3e98"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
