info:
  name: Create Thread Unknown Team
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:4999/sdec-ipaas-stub/api/v1/thread
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "pid": "1001",
        "team": "No_Such_Team"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.headers['content-type']
      operator: contains
      value: application/json
    - expression: res.body.error
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
