info:
  name: Health check
  type: http
  seq: 1

http:
  method: GET
  url: "{{HOST}}/ping/ping"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
