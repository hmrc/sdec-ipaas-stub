info:
  name: Create or update staff enrolments
  type: http
  seq: 2

http:
  method: PUT
  url: "{{HOST}}/sdec-ipaas-stub/api/v1/staff"
  body:
    type: json
    data: |-
      {
        "pid": "1001",
        "name": "John Tester",
        "email": "j.tester@example.com",
        "enrollments": [
          {
            "team": "Child_Benefit",
            "role": "User"
          },
          {
            "team": "VAT",
            "role": "Manager"
          },
          {
            "team": "Customs",
            "role": "User"
          }
        ]
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isJson
    - expression: res.body.staffId
      operator: isDefined
    - expression: res.body.teamIds
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
