info:
  name: Create or update staff SRS
  type: http
  seq: 1

http:
  method: POST
  url: "{{HOST}}/sdec-ipaas-stub/api/v1/staff"
  body:
    type: json
    data: |-
      {
        "pid": "1001",
        "name": "John Tester",
        "email": "j.tester@example.com",
        "srs": "SDEC_Child_Benefit_Manager"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isJson
    - expression: res.body.staffId
      operator: isDefined
    - expression: res.body.teamId
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
