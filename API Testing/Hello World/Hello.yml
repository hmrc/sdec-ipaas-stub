info:
  name: Hello
  type: http
  seq: 1

http:
  method: GET
  url: https://api.hmrc.qa.le.gb.cam.boomi.com/hello/world
  headers:
    - name: Accept
      value: application/vnd.hmrc.1.0+json
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isJson
    - expression: res.body.message
      operator: eq
      value: Hello World

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
